name: SANKET
options:
  bundleIdPrefix: com.sanket
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: SANKET
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SANKET:
    type: application
    platform: iOS
    sources:
      - path: SANKET
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanket.worker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Used to show nearby training centres on the map.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: SANKET/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: SANKET
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sanket.worker
            CFBundleURLSchemes:
              - sanket
schemes:
  SANKET:
    build:
      targets:
        SANKET: all
    run:
      config: Debug
